<table class="data">
    <tr class="grey">
        <td colspan="2">
            <strong>Sets ({{sets|length}})</strong>
        </td>
    </tr>
    <tr class="grey">
        <td style="font-style: italic;">Spec</td>
        <td style="font-style: italic;">Name</td>
    </tr>
    {% for object in sets %}
        <tr>
            <td>
                <span class='value'>{{ object.set_spec }}</span>
            </td>
            <td>
                <span class='value'>{{ object.set_name }}</span>
            </td>
        </tr>
    {% endfor %}
</table>
